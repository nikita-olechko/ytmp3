{% extends "base.html" %}
{% block content %}
<header>
  <h1>ytmp3</h1>
  <form method="post" action="{{ url_for('auth.logout') }}"><button class="link">Log out</button></form>
</header>
<form id="add" class="card">
  <textarea id="urls" rows="4" placeholder="Paste YouTube links, one per line" required></textarea>
  <div class="row">
    <select id="quality">
      {% for q in qualities %}<option value="{{ q }}" {% if q == '192' %}selected{% endif %}>{{ q }} kbps</option>{% endfor %}
    </select>
    <button type="submit">Add &amp; download</button>
  </div>
</form>
<p class="hint">Links are processed one at a time; each file downloads as soon as it's ready. The first one may take a while while the server wakes up.</p>
<ul id="queue"></ul>
<script src="{{ url_for('static', filename='queue.js') }}"></script>
{% endblock %}
