services:
  ytmp3:
    build:
      context: https://github.com/nikita-olechko/ytmp3.git#main
    image: ytmp3:latest
    container_name: ytmp3
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_PASSWORD: change-me
      SECRET_KEY: change-me-to-a-long-random-string
